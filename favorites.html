<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="stylesheet" href="css/stylefavorites.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Overpass:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites</title>
</head>
<body>
        <header class="entete">
    <div class="entete-inner">
      <p class="logo">MealPlanner</>

      <nav class="nav-principale" aria-label="Navigation principale">
        <ul>
          <li><a href="index.html"  >Home</a></li>
          <li><a href="My planning.html">My Planning</a></li>
          <li><a href="Shopping list.html">Shopping List</a></li>
          <li><a href="my recipes.html">My Recipes</a></li>
          <li><a href="favorites.html" class="lien-actif" aria-current="page">Favorites</a></li>
        </ul>
      </nav>

      <button type="button" class="bouton-theme" id="bouton-theme" aria-pressed="false">
        <img src="img/img thème.jpeg" alt="icône de changement de thème">
      </button>
    </div>
  </header>
  <main>
    <div class="header">
        <div class="title">
    <h1>My Favorites</h1>
    <p>Your personal collection of go-to meals and culinary inspirations.</p>
</div>
<div class="search-title">
    <input type="text" name="search" id="search-favoris" placeholder="Search favorites...">
</div>
</div>
<div class="bouton-fav">
    <button type="button" id="all-recipes" aria-pressed="true" class="bouton-actif">All Recipes</button>
    <button type="button" id="breakfast" aria-pressed="false" data-filtre="Petit-déjeuner">Breakfast</button>
    <button type="button" id="vegetarien" aria-pressed="false" data-filtre="Vegetarienne">Vegetarian</button>
    <button type="button" id="quick" aria-pressed="false" data-filtre="rapide">Quick & Easy</button>
    <button type="button" id="dinner" aria-pressed="false" data-filtre="dinner">Dinner</button>
    <button type="button" id="deserts" aria-pressed="false" data-filtre="desserts">Desserts</button>
</div>
<div id="recipe-card"></div>
  </main>
  <div id="modale-recette" class="modale" role="dialog" aria-modal="true" aria-labelledby="modale-titre" hidden>
  <div class="modale-contenu">

    <div class="modale-hero">
      <img id="modale-image" src="" alt="">
      <button type="button" id="fermer-modale" aria-label="Fermer la fiche recette">
        <img src="img/icon-close.svg" alt="">
      </button>
      <div class="modale-badges">
        <span id="modale-categorie"></span>
        <span id="modale-origine"></span>
        <span id="modale-temps"></span>
      </div>
      <h2 id="modale-titre"></h2>
    </div>

    <div class="modale-body">
      <div class="modale-colonne-gauche">
        <div class="modale-planification">
          <div class="planification-header">
            <h3 id="plannification-text">Planification</h3>
            <button type="button" id="modale-favori" aria-label="Ajouter aux favoris">
              <img src="img/heart_empty.png" alt="">
            </button>
          </div>
          <div class="plannification-program">
            <select name="jour" id="jour-select">
  <option value="" disabled selected>Jour</option>
  <option value="mon">Lundi</option>
  <option value="tue">Mardi</option>
  <option value="wed">Mercredi</option>
  <option value="thu">Jeudi</option>
  <option value="fri">Vendredi</option>
  <option value="sat">Samedi</option>
  <option value="sun">Dimanche</option>
</select>
            <select name="repas" id="repas-select">
              <option value="" disabled selected>Repas</option>
              <option value="matin">Matin</option>
              <option value="midi">Midi</option>
              <option value="soir">Soir</option>
            </select>
          </div>
          <button type="button" id="modale-ajouter-planning">
            Ajouter au planning
          </button>
        </div>

        <h3>Ingrédients</h3>
        <ul id="modale-ingredients"></ul>
      </div>

      <div class="modale-colonne-droite">
        <h3>Préparation</h3>
        <ol id="modale-instructions"></ol>
      </div>
    </div>

  </div>
</div>
  <script src="js/app-favoris.js" type="module"></script>
</body>
</html>
